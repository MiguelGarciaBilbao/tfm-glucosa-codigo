# Fase 4 — ablación de arquitectura: Transformer ligero.
# Los hiperparámetros salen del barrido sobre la partición de VALIDACIÓN;
# el test oficial no intervino en la selección.
exp_id: 20260916-global-transformer
kind: global
architecture: transformer
description: >
  Transformer con codificación posicional sinusoidal sobre los mismos 12 pasos.
  Si la autoatención no aporta nada sobre una ventana tan corta, eso también es
  un resultado publicable: justifica quedarse con el recurrente.
seeds: [0, 1, 2]
# Mejor combinación del barrido sobre validación (NLL -0,0962). Aun así pierde
# contra el BiGRU (-0,1037) usando 3,6 veces más parámetros.
model:
  d_model: 128
  num_layers: 4
  nhead: 4
  dim_feedforward: 128
  dropout: 0.1
loss:
  name: gaussian_nll
  beta: 0.5          # corrección de Seitzer et al. (2022): la NLL pura subajusta mu
training:
  lr: 0.001
  batch_size: 256
  max_epochs: 100
  patience: 10
  weight_decay: 0.001
  warmup_epochs: 5   # épocas con MSE antes de pasar a NLL
  grad_clip: 1.0
data:
  source: data/processed
  patients: [559, 563, 570, 575, 588, 591, 540, 544, 552, 567, 584, 596]
  history: 12
  horizons_min: [30, 60]
  val_fraction: 0.2
evaluation:
  event_tolerance_min: 15
  sensitivity: true
