# Línea base 2: un LSTM por paciente, entrenado solo con sus propios datos.
exp_id: 20260916-baseline-lstm-paciente
baseline: lstm_per_patient
description: >
  LSTM de 1 capa y 64 unidades sobre 12 pasos de historia, salida de 2 valores
  (PH 30 y 60 min). Early stopping sobre el corte temporal del 20 % final del
  train. El test oficial se toca una sola vez, al predecir.
seeds: [0, 1, 2]
# Seleccionados por barrido sobre la pérdida media de VALIDACIÓN de los 12
model:
  hidden_size: 64
  dropout: 0.0
training:
  lr: 0.001
  batch_size: 256
  max_epochs: 100
  patience: 10
  weight_decay: 0.001
  grad_clip: 1.0
data:
  source: data/processed
  patients: [559, 563, 570, 575, 588, 591, 540, 544, 552, 567, 584, 596]
  history: 12
  horizons_min: [30, 60]
  val_fraction: 0.2
evaluation:
  event_tolerance_min: 15
  sensitivity: true
