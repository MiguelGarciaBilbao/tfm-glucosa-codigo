# Fase 4 — ablación de pérdida: misma arquitectura entrenada con MSE.
# Los hiperparámetros salen del barrido sobre la partición de VALIDACIÓN;
# el test oficial no intervino en la selección.
exp_id: 20260916-global-bigru-mse
kind: global
architecture: bigru
description: >
  Idéntico al global principal salvo la pérdida: MSE sobre mu, ignorando la
  cabeza de varianza. Aísla qué aporta la verosimilitud frente a la
  arquitectura, que es lo único que cambia entre ambos.
seeds: [0, 1, 2]
model:
  hidden_size: 128
  num_layers: 1
  dropout: 0.0
loss:
  name: mse
training:
  lr: 0.001
  batch_size: 256
  max_epochs: 100
  patience: 10
  weight_decay: 0.001
  warmup_epochs: 0   # no aplica: la pérdida ya es MSE
  grad_clip: 1.0
data:
  source: data/processed
  patients: [559, 563, 570, 575, 588, 591, 540, 544, 552, 567, 584, 596]
  history: 12
  horizons_min: [30, 60]
  val_fraction: 0.2
evaluation:
  event_tolerance_min: 15
  sensitivity: true
